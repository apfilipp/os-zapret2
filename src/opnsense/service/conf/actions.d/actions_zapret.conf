[start]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/zapret_service.sh start
parameters:
type:script
message:starting zapret2

[stop]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/zapret_service.sh stop
parameters:
type:script
message:stopping zapret2

[restart]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/zapret_service.sh restart
parameters:
type:script
message:restarting zapret2

[reconfigure]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/zapret_service.sh reconfigure
parameters:
type:script
message:reconfiguring zapret2

[status]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/zapret_service.sh status; exit 0
parameters:
type:script_output
message:zapret2 status

[blockcheck_start]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/blockcheck_job.sh start
parameters:%s %s
type:script_output
message:starting blockcheck2 against domain
timeout:10
errors:no

[blockcheck_status]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/blockcheck_job.sh status
type:script_output
message:getting blockcheck2 status
timeout:10
errors:no

[blockcheck_stop]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/blockcheck_job.sh stop
type:script_output
message:stopping blockcheck2
timeout:10
errors:no

[testdomain]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/test_domain.sh
parameters:%s
type:script_output
message:testing domain connectivity
timeout:30
errors:no
